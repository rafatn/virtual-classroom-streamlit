<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת שיעורים מקוונים</title>
    <script src='https://8x8.vc/vpaas-magic-cookie-411409559c3a4f6bb2d34aae36e78988/external_api.js'></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; margin-top: 50px; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: white; box-sizing: border-box; }
        button { background: #28a745; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #218838; }
        #app-container { display: none; width: 100%; height: 90vh; flex-direction: column; }
        #top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #meet-container { width: 100%; height: 85vh; border-radius: 8px; overflow: hidden; background: #000; }
        .danger-btn { background: #dc3545; width: auto; padding: 8px 20px; margin: 0; }
        .danger-btn:hover { background: #c82333; }
    </style>
</head>
<body>

    <!-- מסך התחברות -->
    <div id="login-screen" class="card">
        <h2>🎓 כניסה לשיעור</h2>
        <input type="text" id="username" placeholder="שם מלא">
        <input type="text" id="room" placeholder="קוד חדר (למשל: math-101)">
        <button onclick="startClass()">הכנס לשיעור</button>
    </div>

    <!-- מסך השידור והניהול -->
    <div id="app-container">
        <div id="top-bar">
            <h3 id="room-display" style="margin: 0; color: #4CAF50;"></h3>
            <button class="danger-btn" onclick="leaveClass()">יציאה מהשיעור</button>
        </div>
        <div id="meet-container"></div>
    </div>

    <script>
        let jitsiApi = null;

        // טעינת שם משתמש אחרון אם קיים בזיכרון הדפדפן
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('last_username');
            if (savedUser) {
                document.getElementById("username").value = savedUser;
            }
        });

        function startClass() {
            const username = document.getElementById("username").value.trim();
            const roomName = document.getElementById("room").value.trim();

            if (!username || !roomName) {
                alert("נא למלא את כל השדות");
                return;
            }

            // שמירת השם לפעם הבאה
            localStorage.setItem('last_username', username);

            // מעבר בין מסכים
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-container").style.display = "flex";
            document.getElementById("room-display").innerText = "חדר שיעור: " + roomName;

            const domain = "meet.jit.si";
            const options = {
                roomName: "RafatClassroom_" + roomName,
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#meet-container'),
                userInfo: {
                    displayName: username
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                }
            };

            jitsiApi = new JitsiMeetExternalAPI(domain, options);
            
            // האזינו לאירוע סגירה מצד המשתמש בתוך המערכת
            jitsiApi.addListener('videoConferenceLeft', () => {
                leaveClass();
            });
        }

        function leaveClass() {
            if (jitsiApi) {
                jitsiApi.dispose();
                jitsiApi = null;
            }
            document.getElementById("app-container").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
        }
    </script>
</body>
</html>
