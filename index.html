<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת שיעורים מקוונים - Jitsi</title>
    <!-- טעינת ספרית ההטמעה הרשמית של Jitsi -->
    <script src='https://8x8.vc/vpaas-magic-cookie-411409559c3a4f6bb2d34aae36e78988/external_api.js'></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; margin-top: 50px; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: white; box-sizing: border-box; }
        button { background: #28a745; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #218838; }
        #meet-container { display: none; width: 100%; height: 90vh; margin-top: 10px; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

    <!-- מסך התחברות -->
    <div id="login-screen" class="card">
        <h2>🎓 כניסה לשיעור</h2>
        <input type="text" id="username" placeholder="שם מלא">
        <input type="text" id="room" placeholder="שם חדר (למשל: math-class-101)">
        <button onclick="startClass()">הכנס לשיעור</button>
    </div>

    <!-- מסך השידור של Jitsi -->
    <div id="meet-container"></div>

    <script>
        function startClass() {
            const username = document.getElementById("username").value.trim();
            const roomName = document.getElementById("room").value.trim();

            if (!username || !roomName) {
                alert("נא למלא את כל השדות");
                return;
            }

            // הסתרת מסך ההתחברות והצגת אזור הווידאו
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("meet-container").style.display = "block";

            // יצירת חדר Jitsi ציבורי ומאובטח באופן אוטומטי
            const domain = "meet.jit.si";
            const options = {
                roomName: "RafatClassroom_" + roomName,
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#meet-container'),
                userInfo: {
                    displayName: username
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                },
                interfaceConfigOverwrite: {
                    DEFAULT_BACKGROUND: '#121212'
                }
            };

            const api = new JitsiMeetExternalAPI(domain, options);
        }
    </script>
</body>
</html>
